name: Keepalive Workflow

# If there haven't been any commits in the main/master branch in the last 60 days,
# Github will disable the workflows in the repository with the following error:
#
# "This scheduled workflow is disabled because there hasn't been activity in this repository
# for at least 60 days. Enable this workflow to resume scheduled runs."
#
# master is protected (changes must go through a pull request), so instead of pushing an
# empty commit we re-enable every workflow via the API, which resets the inactivity timer.

on:
  schedule:
    - cron: "0 0 */15 * *" # run every fifteen days at midnight
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Re-enable workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate --jq '.workflows[] | select(.state != "disabled_manually") | .id'); do
            echo "Enabling workflow ${id}"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/enable"
          done
